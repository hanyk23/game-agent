<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <title>Vertical Shooter Template</title>
    <style>
      html,
      body,
      #game-root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #07111f;
      }

      canvas {
        display: block;
        margin: auto;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <main id="game-root" aria-label="Vertical bullet-hell game"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
